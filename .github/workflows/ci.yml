name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: Compile-check
        run: python -m py_compile main.py beyes.py configuration.py data_import.py helper.py visualizations.py
      - name: Run pytest
        run: pytest tests/ -v
